{% extends "base.html" %}

{% block body %}

<div class="container"> <div class="row justify-content-center align-items-center min-vh-100">
    <div class="col-12 col-sm-10 col-md-8 col-lg-6">

        <div class="card shadow border-0 rounded-4">
            <div class="card-body p-4 p-md-5">

                <div class="text-center mb-4">
                    <h1 class="h3 fw-bold">Add Expense</h1>
                    <p class="text-muted mb-0">
                        Record a new expense
                    </p>
                </div>

                <form method="post">
                    {% csrf_token %}

                    {{ form.as_p }}

                    <button type="submit"
                            class="btn btn-primary w-100 py-2 mt-2">
                        Add Expense
                    </button>
                </form>

            </div>
        </div>

    </div>

</div>

</div>

{% endblock body %}
